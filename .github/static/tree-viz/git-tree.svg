<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="980" 
     viewBox="0 0 1200 980">
  <defs>
    <radialGradient id="leafGradient">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:0.8" />
    </radialGradient>
    <radialGradient id="mergeGradient">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.8" />
    </radialGradient>
    <radialGradient id="forkGradient">
      <stop offset="0%" style="stop-color:#fb923c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:0.8" />
    </radialGradient>
    <radialGradient id="tagGradient">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:0.8" />
    </radialGradient>
    <style>
      .branch-line { stroke: #64748b; stroke-width: 2; fill: none; opacity: 0.7; }
      .trunk-line { stroke: #22c55e; stroke-width: 2.5; fill: none; opacity: 0.6; }
      .commit-leaf { cursor: pointer; }
      .commit-leaf:hover { filter: brightness(1.5); }
      .branch-label { font-family: sans-serif; font-size: 12px; font-weight: bold; fill: #0f172a; }
    </style>
  </defs>
  
  <rect width="1200" height="980" fill="#f8fafc"/>
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#e2e8f0" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="980" fill="url(#grid)"/>
  
  <!-- Branch connection lines -->
  <g id="branches">
    <line class="trunk-line" x1="600" y1="60" x2="600" y2="180"/>
    <path class="branch-line" d="M 600 60 C 600 76, 720 84, 720 100"/>
    <path class="branch-line" d="M 720 100 C 720 132, 600 148, 600 180"/>
    <line class="trunk-line" x1="600" y1="180" x2="600" y2="220"/>
    <line class="trunk-line" x1="600" y1="220" x2="600" y2="260"/>
    <line class="trunk-line" x1="600" y1="260" x2="600" y2="300"/>
    <line class="trunk-line" x1="600" y1="300" x2="600" y2="340"/>
    <line class="trunk-line" x1="600" y1="340" x2="600" y2="380"/>
    <line class="trunk-line" x1="600" y1="380" x2="600" y2="420"/>
    <line class="trunk-line" x1="600" y1="420" x2="600" y2="460"/>
    <line class="trunk-line" x1="600" y1="460" x2="600" y2="500"/>
    <line class="trunk-line" x1="600" y1="500" x2="600" y2="540"/>
    <line class="trunk-line" x1="600" y1="540" x2="600" y2="580"/>
    <line class="trunk-line" x1="600" y1="580" x2="600" y2="620"/>
    <line class="trunk-line" x1="600" y1="620" x2="600" y2="660"/>
    <line class="trunk-line" x1="600" y1="660" x2="600" y2="700"/>
    <line class="trunk-line" x1="600" y1="700" x2="600" y2="740"/>
    <line class="trunk-line" x1="600" y1="740" x2="600" y2="780"/>
    <line class="trunk-line" x1="600" y1="780" x2="600" y2="820"/>
    <line class="trunk-line" x1="600" y1="820" x2="600" y2="860"/>
  </g>
  <!-- Commit nodes -->
  <g id="commits">
    <circle class="commit-leaf" cx="600" cy="60" r="10" fill="url(#mergeGradient)" stroke="#7c3aed" stroke-width="1.5"><title>43c95d3: Merge pull request #3 from XAOSTECH:humanise/20261015-074801</title></circle>
    <circle class="commit-leaf" cx="720" cy="100" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>4486c4b: chore: humanise hard-wrapped comments and prose</title></circle>
    <circle class="commit-leaf" cx="600" cy="180" r="9" fill="url(#forkGradient)" stroke="#ea580c" stroke-width="1.5"><title>077a90a: chore(dc-init): update workflows,actions</title></circle>
    <circle class="commit-leaf" cx="600" cy="220" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>11e77c9: feat(courses,progress): scaffold /api/progress + /api/courses + /courses HTML panel</title></circle>
    <circle class="commit-leaf" cx="600" cy="260" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>4715cc0: chore: drop migrations/ (schemas now consolidated in data.xaostech.io/migrations/)</title></circle>
    <circle class="commit-leaf" cx="600" cy="300" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>2ea51d3: fix: replace in-memory rate limiting with KV, route auth through API proxy</title></circle>
    <circle class="commit-leaf" cx="600" cy="340" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>92a38ee: chore: consolidate workflows into monorepo</title></circle>
    <circle class="commit-leaf" cx="600" cy="380" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>ebaf8b3: chore: gitignore</title></circle>
    <circle class="commit-leaf" cx="600" cy="420" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>2b16dcd: refactor: Remove D1 bindings, use API proxy</title></circle>
    <circle class="commit-leaf" cx="600" cy="460" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>aeb865b: feat: Migrate exercise bank to D1 database</title></circle>
    <circle class="commit-leaf" cx="600" cy="500" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>9091303: feat: add static exercise bank for AI fallback</title></circle>
    <circle class="commit-leaf" cx="600" cy="540" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>1ce1d13: feat: add parent notification triggers</title></circle>
    <circle class="commit-leaf" cx="600" cy="580" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>1b9af07: feat: add content rating system for parental controls</title></circle>
    <circle class="commit-leaf" cx="600" cy="620" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>e7cf50d: feat: add child-friendly UI with time banners and learning pages</title></circle>
    <circle class="commit-leaf" cx="600" cy="660" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>3ec38d7: style: apply formatter to parental controls</title></circle>
    <circle class="commit-leaf" cx="600" cy="700" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>f9cf095: feat: integrate parental controls middleware</title></circle>
    <circle class="commit-leaf" cx="600" cy="740" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>d43ffaf: chore: update dependencies to fix security vulnerabilities</title></circle>
    <circle class="commit-leaf" cx="600" cy="780" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>8bf7641: feat(edu): add multi-model fallback chain for AI exercise generation</title></circle>
    <circle class="commit-leaf" cx="600" cy="820" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>b713583: feat: Add AI-powered exercise generation platform</title></circle>
    <circle class="commit-leaf" cx="600" cy="860" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>75dfc20: Initial commit</title></circle>
  </g>
  
  <!-- Legend -->
  <g id="legend" transform="translate(20, 20)">
    <rect width="200" height="110" fill="white" stroke="#cbd5e1" stroke-width="1" rx="4"/>
    <circle cx="20" cy="25" r="5" fill="url(#leafGradient)" stroke="#16a34a"/>
    <text x="32" y="30" class="branch-label" font-size="12">Regular Commit</text>
    <circle cx="20" cy="50" r="6" fill="url(#mergeGradient)" stroke="#7c3aed"/>
    <text x="32" y="55" class="branch-label" font-size="12">Merge Commit</text>
    <circle cx="20" cy="75" r="6" fill="url(#forkGradient)" stroke="#ea580c"/>
    <text x="32" y="80" class="branch-label" font-size="12">Fork Point</text>
    <circle cx="20" cy="100" r="6" fill="url(#tagGradient)" stroke="#0284c7"/>
    <text x="32" y="105" class="branch-label" font-size="12">Tagged</text>
  </g>
  
  <!-- Repository info -->
  <g id="info" transform="translate(20, 940)">
    <text x="0" y="0" class="branch-label" font-size="12" fill="#666">
      Repository: edu.xaostech.io
    </text>
    <text x="0" y="20" class="branch-label" font-size="10" fill="#999">
      Generated: 2026-10-15 07:48:35 UTC
    </text>
  </g>
</svg>
